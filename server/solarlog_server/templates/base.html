<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Solar-Log{% endblock %}</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e2e2dc; --accent:#d98e04; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ececea; --muted:#a3a39d; --card:#20201e; --line:#34342f; --accent:#f2b134; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: .2rem 0 1rem; }
  h2 { font-size: 1.05rem; margin: 0 0 .6rem; }
  a { color: var(--accent); }
  .grid { display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .stat .v { font-size:1.6rem; font-weight:600; font-variant-numeric: tabular-nums; }
  .stat .l { color:var(--muted); font-size:.85rem; }
  table { width:100%; border-collapse:collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align:right; padding:4px 8px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  .muted { color: var(--muted); }
  .scroll { overflow-x:auto; }
  canvas { max-width:100%; }
</style>
</head>
<body><main>{% block body %}{% endblock %}</main></body>
</html>
