[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarlog-server"
version = "0.1.0"
description = "Self-hosted server, analysis and dashboard for the Solar-Log roof survey logger"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["solarlog_server*"]

[tool.setuptools.package-data]
solarlog_server = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
