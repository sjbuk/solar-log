; Solar-Log firmware
;   pio test -e native          hardware-independent unit tests (host compiler)
;   pio run  -e esp32dev        original ESP32 DevKitC / NodeMCU-32S (primary)
;   pio run  -e xiao_esp32c3    Seeed XIAO ESP32-C3 (alternative low-power board)

[platformio]
default_envs = esp32dev

[common]
lib_deps =
  adafruit/Adafruit INA219 @ ^1.2.3
  adafruit/RTClib @ ^2.1.4
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^3.11.0
  tzapu/WiFiManager @ ^2.0.17
build_flags =
  -DSOLARLOG_FW_VERSION=\"0.1.0\"
  -DCORE_DEBUG_LEVEL=0

[esp32_base]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.f_cpu = 80000000L
lib_deps = ${common.lib_deps}

[env:esp32dev]
extends = esp32_base
board = esp32dev
board_build.partitions = partitions_4mb.csv
build_flags = ${common.build_flags} -DSOLARLOG_BOARD_ESP32DEV

[env:xiao_esp32c3]
extends = esp32_base
board = seeed_xiao_esp32c3
board_build.partitions = partitions_4mb.csv
build_flags = ${common.build_flags} -DSOLARLOG_BOARD_XIAO_C3

[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17 -Wall -Wextra
